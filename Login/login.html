<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../Login/login.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Login</h1>
            <p>Entre no sistema de avaliações</p>

            <form id="loginForm">

                <label for="email">E-mail</label>
                <input
                    type="text"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >

                <button type="submit">Entrar</button>

            </form>

            <div class="cadastro">

                <p>Não possui uma conta?</p>

                <button type="button" id="botaoCadastro">
                    Criar cadastro
                </button>

            </div>

        </div>

    </div>

    <script src="../Login/login.js"></script>

</body>

</html>
